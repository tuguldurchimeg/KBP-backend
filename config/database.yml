default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  port: 5432
  host: <%= ENV["HOST"] %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: ENV["DATABASE_DEV"]

test:
  <<: *default
  database: ENV["DATABASE_TEST"]

production:
  <<: *default
  database: ENV["DATABASE_PROD"]
